# 更换权重时登记独立的新model_version；固定权重测试证据须填写对应model_version。
# backtest为相同结构、变量与训练计划的逐月重训协议参考，不是固定权重测试。
registry_version: 2
reference_data:
  shanghai: ../data/上海_处理后数据表.xlsx
  zhejiang: ../data/浙江_处理后数据表.xlsx
  jiangsu: ../data/江苏_处理后数据表.xlsx
reference_weights_index: ../joint_emaformer/reference/weights_index.json
models:
  all:
    checkpoint: ../joint_emaformer/weights/all.pt
    model_version: all-bundled-v1
    fixed_test:
      predictions: ../joint_emaformer/reference/fixed_test/all/seed_42/predictions.csv
      version: all-fixed-test-v1
      model_version: all-bundled-v1
    backtest:
      predictions: ../joint_emaformer/reference/backtest/all/seed_42/predictions.csv
      version: all-backtest-v1
      protocol: ../joint_emaformer/reference/backtest/protocol.json
      model_config: ../joint_emaformer/reference/backtest/all/model_config.json
  selected:
    checkpoint: ../joint_emaformer/weights/selected.pt
    model_version: selected-bundled-v1
    fixed_test:
      predictions: ../joint_emaformer/reference/fixed_test/selected/seed_42/predictions.csv
      version: selected-fixed-test-v1
      model_version: selected-bundled-v1
    backtest:
      predictions: ../joint_emaformer/reference/backtest/selected/seed_42/predictions.csv
      version: selected-backtest-v1
      protocol: ../joint_emaformer/reference/backtest/protocol.json
      model_config: ../joint_emaformer/reference/backtest/selected/model_config.json

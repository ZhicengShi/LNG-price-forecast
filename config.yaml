# 实验数据仅使用三地区处理后的XLSX表。
# 相对路径以本YAML文件所在目录为基准，不受命令启动目录影响。
# 也可改为绝对路径，例如："D:/my_data/上海_处理后数据表.xlsx"。
data:
  shanghai: "data/上海_处理后数据表.xlsx"
  zhejiang: "data/浙江_处理后数据表.xlsx"
  jiangsu: "data/江苏_处理后数据表.xlsx"

# 固定复现区间，按标签月份顺序划分；不随机切分。
period:
  start: "2015-01"
  train_end: "2022-11"
  validation_end: "2024-07"
  test_end: "2026-05"

window:
  seq_len: 12
  pred_len: 3

# 训练集拟合中位数及标准化；输入前向填充，目标标签不填充。
preprocessing:
  missing: ffill   # ffill、median、error

features:
  # 可选字段按各地区实际可用情况选择，完整名称如下：
  # JKM现货价格、LNG进口价格、TTF期货价格、Henry Hub期货价格、Brent原油价格
  # 管道气进口价格、美元/人民币汇率、LNG进口量（全国）、管道气进口量（全国）
  # LNG进口量（区域）、天然气产量（全国总量）、天然气产量（区域）、LNG产量（全国）
  # 门站价基准价格（分省）、中国液化天然气出厂价格指数、工业增加值（分省）
  # 制造业PMI增速（全国）、GDP增速（分省）、平均气温（分省）、采暖度日数HDD（分省）
  # 非居民天然气消费量（分省）、柴油价格（0#柴油）、动力煤价格
  # 终端非居民天然气价格（分省）：历史目标始终输入，不设关闭开关。
  # 浙江停用区域进口量和区域产量；江苏停用工业增加值、GDP和消费量。
  # 训练期全空的列不能作为自选输入。
  # all按处理表顺序选择有效列；排除已停用列及训练期全空列。
  all: all
  # 可以在此修改组合变量。历史目标价格始终保留；顺序参与权重匹配。
  selected:
    shanghai:
      - 终端非居民天然气价格（分省）
      - 管道气进口价格
      - 管道气进口量（全国）
      - LNG产量（全国）
    zhejiang:
      - 终端非居民天然气价格（分省）
      - TTF期货价格
      - 制造业PMI增速（全国）
    jiangsu:
      - 终端非居民天然气价格（分省）
      - 天然气产量（全国总量）
      - LNG产量（全国）
      - 采暖度日数HDD（分省）
      - 柴油价格（0#柴油）

runtime:
  device: auto    # auto、cpu或cuda
  threads: 4
  seed: 42        # 用于复现，结果表不展示seed列。
